<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration | Property Paradise</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            padding-top: 110px;
            padding-bottom: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(8,13,18,.78), rgba(8,13,18,.90)),
                        url("../images/background/hero-house.jpg") center/cover no-repeat;
        }

        .auth-box {
            width: 100%;
            max-width: 450px;
            background: rgba(255,255,255,.98);
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,.45);
            border: 1px solid #d4af37;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .auth-logo img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 10px;
        }

        .auth-box h1 {
            text-align: center;
            color: #111;
            font-family: Georgia, "Times New Roman", serif;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212,175,55,.12);
        }

        .auth-button {
            width: 100%;
            padding: 13px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            background: #111;
            color: #f0d77a;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .auth-button:hover {
            background: #d4af37;
            color: #111;
        }

        .auth-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .auth-links a {
            color: #176b3a;
            font-weight: bold;
            text-decoration: none;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }

        @media(max-width:600px) {
            .auth-box {
                margin: 20px;
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<section class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            <img src="../images/logo/logo.jpeg" alt="Property Paradise Logo">
        </div>

        <h1>User Registration</h1>
        <p class="auth-subtitle">Create your Property Paradise account</p>

        <form onsubmit="registerMessage(event)" novalidate>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel"
                placeholder="Enter your phone number"
                inputmode="numeric"
                maxlength="10"
                pattern="[0-9]{10}"
                oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)"
                required>
           </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="auth-button">
                Create Account
            </button>

        </form>

        

        <div class="auth-links">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <a href="../index.html" class="home-link">
           ← Back to Home
        </a>
        

       
    </div>

</section>

<script>
function registerMessage(event) {
    event.preventDefault();

    const phone = document.querySelector('input[type="tel"]').value;

    if (!/^[0-9]{10}$/.test(phone)) {
        showMessage("Please enter the valid number");
        return;
    }

    showMessage("Registration successfully");
}

function showMessage(message) {
    let messageBox = document.getElementById("successMessage");

    if (!messageBox) {
        messageBox = document.createElement("div");
        messageBox.id = "successMessage";

        messageBox.style.cssText = `
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #176b3a;
            padding: 15px 25px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,.25);
            font-weight: bold;
            z-index: 9999;
        `;

        document.body.appendChild(messageBox);
    }

    messageBox.textContent = message;

    setTimeout(function() {
        messageBox.remove();
    }, 2500);
}
</script>

</body>
</html>
