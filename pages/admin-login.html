<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Property Paradise</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .admin-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(rgba(8,13,18,.88), rgba(8,13,18,.95));
        }

        .admin-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            border: 1px solid #d4af37;
            box-shadow: 0 20px 50px rgba(0,0,0,.5);
        }

        .admin-logo {
            text-align: center;
        }

        .admin-logo img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .admin-box h1 {
            text-align: center;
            margin: 15px 0 5px;
            font-family: Georgia, "Times New Roman", serif;
        }

        .admin-title {
            text-align: center;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #d4af37;
        }

        .admin-button {
            width: 100%;
            padding: 13px;
            background: #111;
            color: #f0d77a;
            border: 1px solid #d4af37;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-button:hover {
            background: #d4af37;
            color: #111;
        }

        .admin-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .admin-links a {
            color: #176b3a;
            font-weight: bold;
            text-decoration: none;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

<section class="admin-page">

    <div class="admin-box">

        <div class="admin-logo">
            <img src="../images/logo/logo.jpeg" alt="Property Paradise Logo">
        </div>

        <h1>Admin Login</h1>

        <p class="admin-title">PROPERTY PARADISE ADMIN PANEL</p>

        <form onsubmit="adminLogin(event)">

            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" placeholder="Enter admin email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter admin password" required>
            </div>

            <button type="submit" class="admin-button">
                Admin Login
            </button>

        </form>

        <div class="admin-links">
            New Admin?
            <a href="admin-register.html">Admin Registration</a>
        </div>

        <a href="../index.html" class="home-link">
           ← Back to Home
        </a>
        

     </div>

</section>

<script>
function adminLogin(event) {
    event.preventDefault();

    showMessage("Login successfully");

    setTimeout(function() {
        window.location.href = "../index.html";
    }, 1500);
}

function showMessage(message) {
    let messageBox = document.getElementById("successMessage");

    if (!messageBox) {
        messageBox = document.createElement("div");
        messageBox.id = "successMessage";

        messageBox.style.cssText = `
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #176b3a;
            padding: 15px 25px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,.25);
            font-weight: bold;
            z-index: 9999;
        `;

        document.body.appendChild(messageBox);
    }

    messageBox.textContent = message;
}
</script>

</body>
</html>
