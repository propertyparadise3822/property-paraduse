<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .details-page {
            min-height: 100vh;
            padding: 130px 8% 70px;
            background: #f5f7f6;
        }

        .details-container {
            max-width: 1200px;
            margin: auto;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 18px;
            border-radius: 7px;
            background: #111;
            color: #f0d77a;
            border: 1px solid #d4af37;
            text-decoration: none;
            font-weight: bold;
        }

        .back-button:hover {
            background: #d4af37;
            color: #111;
        }

        .details-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(212,175,55,.45);
            box-shadow: 0 15px 40px rgba(0,0,0,.12);
        }

        .details-image {
            width: 100%;
            height: 450px;
            overflow: hidden;
            background: #eee;
        }

        .details-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .details-content {
            padding: 35px;
        }

        .details-tag {
            display: inline-block;
            padding: 7px 14px;
            background: #d4af37;
            color: #111;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .details-content h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 36px;
            color: #222;
            margin-bottom: 10px;
        }

        .details-location {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .details-price {
            color: #b08b16;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .details-price small {
            font-size: 14px;
            color: #777;
            font-weight: normal;
        }

        .details-features {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .feature-box {
            background: #f5f2e8;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
        }

        .feature-box strong {
            display: block;
            color: #333;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .feature-box span {
            color: #777;
            font-size: 13px;
        }

        .description-box {
            border-top: 1px solid #eee;
            padding-top: 25px;
        }

        .description-box h2 {
            margin-bottom: 12px;
            color: #222;
        }

        .description-box p {
            color: #666;
            line-height: 1.8;
            font-size: 15px;
        }

        .facility-box {
            margin-top: 25px;
        }

        .facility-box h2 {
            margin-bottom: 15px;
        }

        .facility-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .facility-list span {
            padding: 8px 13px;
            background: #f1f7f3;
            color: #176b3a;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        @media(max-width:700px) {

            .details-page {
                padding: 110px 5% 50px;
            }

            .details-image {
                height: 280px;
            }

            .details-content {
                padding: 25px;
            }

            .details-content h1 {
                font-size: 28px;
            }

            .details-features {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
