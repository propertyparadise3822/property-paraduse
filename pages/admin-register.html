<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | Property Paradise</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .admin-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(rgba(8,13,18,.88), rgba(8,13,18,.95));
        }

        .admin-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            border: 1px solid #d4af37;
            box-shadow: 0 20px 50px rgba(0,0,0,.5);
        }

        .admin-logo {
            text-align: center;
        }

        .admin-logo img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .admin-box h1 {
            text-align: center;
            margin: 15px 0 5px;
            font-family: Georgia, "Times New Roman", serif;
        }

        .admin-title {
            text-align: center;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #d4af37;
        }

        .admin-button {
            width: 100%;
            padding: 13px;
            background: #111;
            color: #f0d77a;
            border: 1px solid #d4af37;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-button:hover {
            background: #d4af37;
            color: #111;
        }

        .admin-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .admin-links a {
            color: #176b3a;
            font-weight: bold;
            text-decoration: none;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

<section class="admin-page">

    <div class="admin-box">

        <div class="admin-logo">
            <img src="../images/logo/logo.jpeg" alt="Property Paradise Logo">
        </div>

        <h1>Admin Registration</h1>

        <p class="admin-title">CREATE ADMIN ACCOUNT</p>

        <form onsubmit="adminRegister(event)">

            <div class="form-group">
                <label>Admin Name</label>
                <input type="text" placeholder="Enter admin name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter admin email" required>
            </div>

            <div class="form-group">
                  <label>Phone Number</label>
                  <input type="tel"
                  placeholder="Enter phone number"
                  inputmode="numeric"
                  maxlength="10"
                  oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)"
                  required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Create password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm password" required>
            </div>

            <button type="submit" class="admin-button">
                Create Admin Account
            </button>

        </form>

        

        <div class="admin-links">
            Already registered?
            <a href="admin-login.html">Admin Login</a>
        </div>

        <a href="../index.html" class="home-link">
           ← Back to Home
        </a>

        

    </div>

</section>

<script>
function adminRegister(event) {
    event.preventDefault();

    const phone = document.querySelector('input[type="tel"]').value;

    if (!/^[0-9]{10}$/.test(phone)) {
        showMessage("Please enter the valid number");
        return;
    }

    showMessage("Registration successfully");
}

function showMessage(message) {
    let messageBox = document.getElementById("successMessage");

    if (!messageBox) {
        messageBox = document.createElement("div");
        messageBox.id = "successMessage";

        messageBox.style.cssText = `
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #176b3a;
            padding: 15px 25px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,.25);
            font-weight: bold;
            z-index: 9999;
        `;

        document.body.appendChild(messageBox);
    }

    messageBox.textContent = message;

    setTimeout(function() {
        messageBox.remove();
    }, 2500);
}
</script>

</body>
</html>
